name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Setujui lisensi Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Pasang Capacitor dan plugin
        run: npm install

      - name: Siapkan folder web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Ambil logo dari index.html
        run: |
          python3 -c "
          import re, base64
          s = open('index.html', encoding='utf-8').read()
          m = re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)', s)
          open('logo.png', 'wb').write(base64.b64decode(m.group(1)))
          print('logo diambil')
          "

      - name: Buat ikon 1024x1024 dari logo
        run: convert logo.png -background black -flatten -resize 820x820 -gravity center -extent 1024x1024 icon.png

      - name: Buat project Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Pasang ikon launcher
        run: |
          R=android/app/src/main/res
          rm -f $R/mipmap-anydpi-v26/ic_launcher*.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}
            s=${d##*:}
            mkdir -p $R/mipmap-$n
            convert icon.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Sinkron ulang ke Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: makna-angka-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
